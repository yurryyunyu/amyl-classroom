<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
  <div id="app" class="app">

        <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><path d="M7.5 3.2c2.1 0 4 .8 5.5 2.1l-1.1 1.1A6.3 6.3 0 0 0 7.5 4.8 6.3 6.3 0 0 0 3.1 6.4L2 5.3A8.8 8.8 0 0 1 7.5 3.2Zm0-3.2A11.8 11.8 0 0 1 15 3.2l-1.15 1.15A10.2 10.2 0 0 0 7.5 1.6 10.2 10.2 0 0 0 1.15 4.35 11.8 11.8 0 0 1 7.5 0ZM7.5 8a2 2 0 0 1 1.4.6L7.5 10 6.1 8.6A2 2 0 0 1 7.5 8Z"/></svg>

      </span>
    </header>
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view"></main>
    <div class="demo-foot">示例数据 · 演示预览，不会产生真实付款 · Demo only</div>
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10.5V20h11v-9.5"/></svg><span>首页</span></a>
      <a href="#courses" data-tab="courses"><svg viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H20v16H7.5A2.5 2.5 0 0 0 5 21.5V5.5z"/><path d="M5 21.5A2.5 2.5 0 0 1 7.5 19H20"/></svg><span>课程</span></a>
      <a href="#community" data-tab="community"><svg viewBox="0 0 24 24"><path d="M5 16.5 3 20l4-1.5H16a3 3 0 0 0 3-3v-2"/><rect x="6" y="4" width="15" height="11" rx="3"/></svg><span>社区</span></a>
      <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5z"/><path d="M7 10.8v4.7c0 .6 2.2 2.5 5 2.5s5-1.9 5-2.5v-4.7"/><path d="M21 9v6"/></svg><span>学习</span></a>
      <a href="#me" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 19.2c1.4-3.2 3.8-4.7 7-4.7s5.6 1.5 7 4.7"/></svg><span>我的</span></a>
